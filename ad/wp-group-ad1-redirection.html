    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

        body {

                linear-gradient(180deg, #111827 0%, #1f2937 100%);

            letter-spacing: 0.01em;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        .premium-gold-cta:hover {
            transform: translateY(-2px);
            filter: brightness(1.04) saturate(1.06);
        }

        .redirect-card {
            background: rgba(17, 24, 39, 0.82);
            border: 1px solid rgba(255, 223, 148, 0.18);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
        }

        .count-circle {
            width: 7rem;
            height: 7rem;
            border-radius: 9999px;
            background: radial-gradient(circle at 30% 30%, #f6d472, #b8871b 60%, #6b4710 100%);
            color: #111827;
            box-shadow:
                0 18px 40px rgba(215, 156, 31, 0.25),

        }

        .status-text {

        }

        /* Matches the midnight-and-gold astrology poster without changing layout utilities. */
        :root {
            --night: #050914;
            --midnight: #0a1020;
            --gold: #f4c75d;
            --soft-gold: #ffe5a0;
            --paper: #f8f0dc;
        }

        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background:
                radial-gradient(ellipse at 50% 3%, rgba(205, 147, 42, 0.2), transparent 30%),
                radial-gradient(ellipse at 100% 80%, rgba(105, 46, 12, 0.16), transparent 31%),
                linear-gradient(145deg, #050812 0%, #0a1020 48%, #080b14 100%);
            color: var(--paper);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.55;
            background-image:
                radial-gradient(circle at 8% 12%, rgba(255, 211, 102, 0.9) 0 0.04rem, transparent 0.11rem),
                radial-gradient(circle at 72% 19%, rgba(255, 211, 102, 0.7) 0 0.04rem, transparent 0.12rem),
                radial-gradient(circle at 92% 72%, rgba(255, 211, 102, 0.6) 0 0.04rem, transparent 0.12rem);
            background-size: 17rem 19rem, 23rem 21rem, 29rem 25rem;
        }

        header {
            background: rgba(5, 9, 20, 0.9) !important;
            border-bottom-color: rgba(244, 199, 93, 0.24);
            box-shadow: 0 0.75rem 2.5rem rgba(0, 0, 0, 0.36) !important;
            backdrop-filter: blur(1rem);
        }

        .premium-gold-cta {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 36%),
                linear-gradient(135deg, #60350a 0%, #b87926 24%, #f7d66f 52%, #c48423 78%, #6c3f0b 100%);
            color: #241404;
            border-color: rgba(255, 229, 160, 0.68);
            text-shadow: 0 1px rgba(255, 239, 183, 0.38);
        }

        .redirect-card {
            background:
                linear-gradient(135deg, rgba(255, 226, 147, 0.08), transparent 28%),
                rgba(7, 12, 25, 0.86);
            border-color: rgba(244, 199, 93, 0.3);
            box-shadow:
                0 1.5rem 3.75rem rgba(0, 0, 0, 0.48),
                0 0 3.75rem rgba(184, 121, 38, 0.08),
                inset 0 1px 0 rgba(255, 238, 190, 0.1);
        }

        .count-circle {
            background:
                radial-gradient(circle at 30% 25%, #fff0ae, #f4c75d 27%, #bb7620 58%, #6b3d0a 100%);
            color: #251505;
            border-color: rgba(255, 235, 168, 0.7);
            box-shadow:
                0 1.125rem 2.5rem rgba(215, 156, 31, 0.3),
                0 0 2rem rgba(244, 199, 93, 0.15),
                inset 0 2px 0.625rem rgba(255, 255, 255, 0.35);
        }

        .status-text {
            color: var(--soft-gold);
            text-shadow: 0 0 1.25rem rgba(244, 199, 93, 0.25);
        }

        .redirect-card > p:first-child {

        }

        .redirect-card h1 {
            color: var(--soft-gold);
            font-family: 'Playfair Display', 'Hind Siliguri', serif;
            line-height: 1.3;
            text-shadow: 0 0.2rem 1.4rem rgba(236, 180, 68, 0.2);

        .redirect-card h1 + p {

<body class="text-gray-100">
    <script>
        fbq('trackCustom', 'redirection-page-view');
    </script>
    
    <header class="bg-gray-900 py-4 shadow-lg fixed top-0 left-0 w-full z-50">
        <div class="container mx-auto px-4 flex justify-center items-center">
            <a href="https://chat.whatsapp.com/IFNyximpXju36JxNAVEoup?mode=hq1tcla"
                class="px-8 py-4 premium-gold-cta rounded-xl font-bold text-lg inline-flex items-center gap-3">
                WhatsApp গ্রুপে যান
            </a>
        </div>
    </header>

    <main class="min-h-screen flex items-center justify-center px-4 pt-28 pb-10">
        <div class="redirect-card w-full max-w-2xl rounded-3xl p-8 md:p-12 text-center">
            <p class="text-sm uppercase tracking-widest text-yellow-300 mb-3">Secure Redirect</p>
            <h1 class="text-3xl md:text-4xl font-bold mb-4">আপনাকে WhatsApp গ্রুপে নেওয়া হচ্ছে</h1>
            <p class="text-base md:text-lg text-gray-300 max-w-xl mx-auto mb-8">
                অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন। স্বয়ংক্রিয়ভাবে আপনার WhatsApp গ্রুপ লিংকে রিডাইরেক্ট করা হবে।
            </p>

            <div class="count-circle mx-auto flex items-center justify-center text-5xl font-extrabold mb-6"
                id="countdown">
                3
            </div>

            <p class="status-text text-lg font-semibold mb-8" id="statusText">৩ সেকেন্ডের মধ্যে রিডাইরেক্ট করা হবে...
            </p>

            <a href="https://chat.whatsapp.com/IFNyximpXju36JxNAVEoup?mode=hq1tcla"
                class="px-8 py-4 premium-gold-cta rounded-xl font-bold text-lg inline-flex items-center gap-3">
                এখনই ম্যানুয়ালি প্রবেশ করুন
            </a>
        </div>
    </main>

    <script>
        const targetUrl = "https://chat.whatsapp.com/IFNyximpXju36JxNAVEoup?mode=hq1tcla";
        const countdownElement = document.getElementById("countdown");
        const statusText = document.getElementById("statusText");
        let timeLeft = 2;

        const tick = () => {
            countdownElement.textContent = timeLeft;
            statusText.textContent = `${timeLeft} সেকেন্ডের মধ্যে রিডাইরেক্ট করা হবে...`;

            if (timeLeft === 0) {
                statusText.textContent = "এখন আপনাকে WhatsApp গ্রুপে নেওয়া হচ্ছে...";
                window.location.href = targetUrl;
                return;
            }

            timeLeft -= 1;
            setTimeout(tick, 1000);
        };

        tick();
    </script>
</body>

</html>
